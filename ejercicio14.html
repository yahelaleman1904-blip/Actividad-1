<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 14 - Operaciones con Arreglos</title>
</head>
<body>
    <h1>Calculadora de Arreglos</h1>
    
    <div>
        <label for="inputNumeros">Ingresa los números (separados por coma):</label>
        <input type="text" id="inputNumeros" placeholder="Ej. 10, 20, 30" style="width: 250px;">
    </div>
    
    <br>
    <button onclick="calcularOperaciones()">Calcular</button>
    <br><br>

    <div>
        <label for="resMayor">Número mayor:</label>
        <input type="text" id="resMayor" readonly>
    </div>
    <br>
    <div>
        <label for="resMenor">Número menor:</label>
        <input type="text" id="resMenor" readonly>
    </div>
    <br>
    <div>
        <label for="resPromedio">Promedio:</label>
        <input type="text" id="resPromedio" readonly>
    </div>

    <!-- Conectamos el archivo JavaScript -->
    <script src="js/ejercicio14.js"></script>
</body>
</html>
